name: Build desktop packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v* tag to publish (requires artifact_run_id)'
        required: false
        type: string
      artifact_run_id:
        description: 'Successful build run ID to publish (requires release_tag)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: ${{ inputs.artifact_run_id == '' && inputs.release_tag == '' }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            arch: x64
            artifact: Astralink-windows-x64
            files: src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS Apple Silicon
            runner: macos-15
            arch: arm64
            artifact: Astralink-macos-arm64
            files: src-tauri/target/release/bundle/dmg/*.dmg
          - name: macOS Intel
            runner: macos-15-intel
            arch: x64
            artifact: Astralink-macos-x64
            files: src-tauri/target/release/bundle/dmg/*.dmg
          - name: Linux x64
            runner: ubuntu-22.04
            arch: x64
            artifact: Astralink-linux-x64
            files: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
    env:
      CARGO_TERM_COLOR: always
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev libxdo-dev libfuse2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.artifact }}
      - name: Check native Node architecture
        run: node -e "if (process.arch !== '${{ matrix.arch }}') throw new Error('Node architecture must match the runner'); console.log(process.platform, process.arch, process.version)"
      - name: Install project dependencies
        run: npm ci --ignore-scripts
      - name: Test frontend
        run: npm test
      - name: Test SSH engine
        run: npm test --workspace @astralink/engine
      - name: Prepare embedded runtime
        run: npm run resources
      - name: Test Rust core
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build native packages
        run: npm run tauri -- build
      - name: Verify embedded Node and MCP engine
        env:
          ASTRALINK_TEST_INSTALLED_DIR: ${{ github.workspace }}/src-tauri/resources
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml installed_resource_layout_starts_real_engine --lib -- --ignored
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: package
    if: >-
      ${{ always() &&
          ((github.event_name == 'push' && needs.package.result == 'success') ||
           (github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != '' && inputs.release_tag != '')) }}
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id || github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify release source
        env:
          BUILD_RESULT: ${{ needs.package.result }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo 'Release tag must be a version starting with v.' >&2
            exit 1
          fi
          if [[ ! "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo 'Artifact run ID must be numeric.' >&2
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          tag_sha=$(git rev-parse --verify 'FETCH_HEAD^{commit}')
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" || "$tag_sha" != "$GITHUB_SHA" || "$BUILD_RESULT" != 'success' ]]; then
              echo 'Tag or package result does not match this run.' >&2
              exit 1
            fi
          else
            if [[ "$ARTIFACT_RUN_ID" == "$GITHUB_RUN_ID" ]]; then
              echo 'Manual publishing requires a previous build run ID.' >&2
              exit 1
            fi
            run_info=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID" --jq '[.head_sha, .status, .conclusion, .event, .head_branch, .path] | @tsv')
            IFS=$'\t' read -r run_sha status conclusion event branch path <<< "$run_info"
            if [[ "$run_sha" != "$tag_sha" || "$status" != 'completed' || "$conclusion" != 'success' || "$event" != 'push' || "$branch" != "$RELEASE_TAG" || "$path" != '.github/workflows/build-desktop.yml' ]]; then
              echo 'Build run must be a successful tag build of this exact commit.' >&2
              exit 1
            fi
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace its assets.' >&2
            exit 1
          fi
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
          pattern: Astralink-*
          path: artifacts
      - name: Check packages and publish
        run: |
          find artifacts -type f -print
          for platform in windows-x64 macos-arm64 macos-x64 linux-x64; do
            test -d "artifacts/Astralink-$platform"
          done
          mapfile -d '' windows < <(find artifacts/Astralink-windows-x64 -type f -name '*.exe' -print0)
          mapfile -d '' mac_arm < <(find artifacts/Astralink-macos-arm64 -type f -name '*.dmg' -print0)
          mapfile -d '' mac_x64 < <(find artifacts/Astralink-macos-x64 -type f -name '*.dmg' -print0)
          mapfile -d '' deb < <(find artifacts/Astralink-linux-x64 -type f -name '*.deb' -print0)
          mapfile -d '' appimage < <(find artifacts/Astralink-linux-x64 -type f -name '*.AppImage' -print0)
          if (( ${#windows[@]} != 1 || ${#mac_arm[@]} != 1 || ${#mac_x64[@]} != 1 || ${#deb[@]} != 1 || ${#appimage[@]} != 1 )); then
            echo 'Expected one installer per platform and format.' >&2
            exit 1
          fi
          files=("${windows[@]}" "${mac_arm[@]}" "${mac_x64[@]}" "${deb[@]}" "${appimage[@]}")
          for file in "${files[@]}"; do
            test -s "$file"
          done
          if (( $(printf '%s\n' "${files[@]}" | xargs -n1 basename | sort -u | wc -l) != 5 )); then
            echo 'Release asset filenames must be distinct.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Astralink $RELEASE_TAG"
