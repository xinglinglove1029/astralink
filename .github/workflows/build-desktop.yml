name: Build desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            arch: x64
            artifact: Astralink-windows-x64
            files: src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS Apple Silicon
            runner: macos-15
            arch: arm64
            artifact: Astralink-macos-arm64
            files: src-tauri/target/release/bundle/dmg/*.dmg
          - name: macOS Intel
            runner: macos-15-intel
            arch: x64
            artifact: Astralink-macos-x64
            files: src-tauri/target/release/bundle/dmg/*.dmg
          - name: Linux x64
            runner: ubuntu-22.04
            arch: x64
            artifact: Astralink-linux-x64
            files: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
    env:
      CARGO_TERM_COLOR: always
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev libxdo-dev libfuse2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.artifact }}
      - name: Check native Node architecture
        run: node -e "if (process.arch !== '${{ matrix.arch }}') throw new Error('Node architecture must match the runner'); console.log(process.platform, process.arch, process.version)"
      - name: Install project dependencies
        run: npm ci --ignore-scripts
      - name: Test frontend
        run: npm test
      - name: Test SSH engine
        run: npm test --workspace @astralink/engine
      - name: Prepare embedded runtime
        run: npm run resources
      - name: Test Rust core
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build native packages
        run: npm run tauri -- build
      - name: Verify embedded Node and MCP engine
        env:
          ASTRALINK_TEST_INSTALLED_DIR: ${{ github.workspace }}/src-tauri/resources
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml installed_resource_layout_starts_real_engine --lib -- --ignored
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
