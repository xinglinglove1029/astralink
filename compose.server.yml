services:
  astralink:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: ${ASTRALINK_IMAGE:-astralink-server:local}
    restart: unless-stopped
    environment:
      ASTRALINK_ADMIN_PASSWORD: "" # 首次部署在本地填写至少 12 位密码，不要提交真实密码。
      ASTRALINK_MCP_CLIENT_HOST: ${ASTRALINK_MCP_CLIENT_HOST:-}
    ports:
      - "${ASTRALINK_WEB_BIND:-0.0.0.0}:${ASTRALINK_WEB_PORT:-1421}:1421"
    volumes:
      - astralink-data:/var/lib/astralink
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1421/api/auth/status').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  astralink-data:
