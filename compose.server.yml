services:
  astralink:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: astralink-server:local
    restart: unless-stopped
    environment:
      ASTRALINK_PUBLIC_ORIGIN: ${ASTRALINK_PUBLIC_ORIGIN:-http://127.0.0.1:1421}
      ASTRALINK_LOCAL_HTTP: ${ASTRALINK_LOCAL_HTTP:-1}
    ports:
      - "127.0.0.1:1421:1421"
    volumes:
      - astralink-data:/var/lib/astralink
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1421/api/auth/status').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  astralink-data:
