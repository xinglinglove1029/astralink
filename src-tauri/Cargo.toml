[package]
name = "astralink"
version = "0.1.0"
description = "Astralink SSH connections and integrated MCP"
authors = ["Astralink contributors"]
edition = "2021"

[lib]
name = "astralink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
base64 = "0.22"
toml_edit = "0.22"
serde_yaml_ng = "0.10"
csv = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
regex = "1"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
